services:
  colawae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colawae
    restart: unless-stopped
    ports:
      - "127.0.0.1:4253:4253"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4253
      COLAWAE_DATA_DIR: /app/data
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - colawae_data:/app/data

volumes:
  colawae_data:
